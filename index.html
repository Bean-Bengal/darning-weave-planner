<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darning Weave Planner</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#f4efe6;color:#2a2622}
main{max-width:520px;margin:0 auto;padding:14px}
h1{font-size:1.4rem;margin:4px 0 10px}
label{display:block;margin:8px 0}
input{width:100%;font-size:1rem;padding:8px;border:1px solid #b9ae9c;border-radius:6px}
#info{margin:12px 0;font-size:.95rem}
#grid{display:grid;gap:2px;width:100%;max-width:100%}
.c{aspect-ratio:1;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:.7rem}
.o{background:#2f6b4f;color:#fff}
.u{background:#e8dcc3;color:#6b5d44}
#rows{font-family:monospace;font-size:.85rem;margin-top:12px;overflow-wrap:anywhere}
</style></head><body>
<script data-bean-store>(function(){if(typeof location!=='undefined'&&location&&location.protocol==='about:'&&typeof document!=='undefined'&&document.addEventListener){document.addEventListener('click',function(e){var a=e.target&&e.target.closest&&e.target.closest('a[href^="#"]');if(!a||a.target==='_blank')return;e.preventDefault();try{location.hash=a.getAttribute('href')}catch(x){}},true)}if(typeof window==='undefined')return;try{window.localStorage.getItem('x');return}catch(e){}var d=Object.assign({},window.__BEAN_SAVED||{});function post(){try{parent.postMessage({type:'bean-store',data:d},'*')}catch(e){}}var ls={getItem:function(k){return Object.prototype.hasOwnProperty.call(d,k)?d[k]:null},setItem:function(k,v){d[k]=String(v);post()},removeItem:function(k){delete d[k];post()},clear:function(){d={};post()},key:function(i){return Object.keys(d)[i]||null}};Object.defineProperty(ls,'length',{get:function(){return Object.keys(d).length}});try{Object.defineProperty(window,'localStorage',{value:ls,configurable:true})}catch(e){}})();</script><main>
<h1>Darning Weave Planner</h1>
<label>Hole diameter (mm)<input id="d" type="number" min="1" step="1" value="30"></label>
<label>Thread spacing (mm)<input id="s" type="number" min="0.5" step="0.5" value="3"></label>
<div id="info"></div>
<div id="grid"></div>
<div id="rows"></div>
<p style="font-size:.85rem">Green = needle goes over the thread, tan = under. Each row starts the opposite way from the one above. The grid is one thread wider each side of the hole to anchor on.</p>
</main>
<script>
function makeWeave(opts){
  opts=opts||{};
  return function(row,cols){
    var out=[];
    for(var c=0;c<cols;c++){
      var k=opts.noFlip?c:(row+c);
      out.push(k%2===0?'O':'U');
    }
    return out.join('');
  };
}
var weave=makeWeave();
var brokenWeave=makeWeave({noFlip:true});
function gridSize(d,s){return Math.ceil(d/s)+2;}
var SAMPLE=['OUOU','UOUO','OUOU','UOUO'];
function sampleOk(fn){
  for(var r=0;r<4;r++){ if(fn(r,4)!==SAMPLE[r]) return false; }
  return gridSize(30,10)===5 && gridSize(31,10)===6;
}
var checkResult=false;
try{
  var good=sampleOk(weave), twinRejected=!sampleOk(brokenWeave);
  checkResult=good&&twinRejected;
  if(!checkResult) console.error('weave check failed',good,twinRejected);
}catch(e){console.error(e);}

var dEl=document.getElementById('d'),sEl=document.getElementById('s');
function draw(){
  var d=parseFloat(dEl.value),s=parseFloat(sEl.value);
  var g=document.getElementById('grid'),info=document.getElementById('info'),rows=document.getElementById('rows');
  g.innerHTML='';rows.innerHTML='';
  if(!(d>0)||!(s>0)){info.textContent='Enter a hole size and a spacing above zero.';return;}
  var n=gridSize(d,s);
  if(n>40){info.textContent='That is '+n+' threads across, too many to draw. Try a bigger spacing.';return;}
  info.textContent=n+' threads across, '+n+' rows.';
  g.style.gridTemplateColumns='repeat('+n+',1fr)';
  var lines=[];
  for(var r=0;r<n;r++){
    var w=weave(r,n);
    lines.push('Row '+(r+1)+': '+w);
    for(var c=0;c<n;c++){
      var x=document.createElement('div');
      x.className='c '+(w[c]==='O'?'o':'u');
      x.textContent=w[c];
      g.appendChild(x);
    }
  }
  rows.innerHTML=lines.join('<br>');
}
dEl.oninput=draw;sEl.oninput=draw;
draw();
</script></body></html>
